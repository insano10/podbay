<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Airlock">
  <!-- A hatch: outer ring, viewport, and four bolts. Same frame, stroke
       weight and palette as the Comms icon so the pair reads as a set. -->
  <rect width="64" height="64" rx="14" fill="#1f2a44"/>
  <circle cx="32" cy="32" r="19" fill="none" stroke="#7cc6ff" stroke-width="4.5"/>
  <circle cx="32" cy="32" r="8" fill="none" stroke="#7cc6ff" stroke-width="3.5"/>
  <g fill="#7cc6ff">
    <circle cx="32" cy="9.5" r="3.2"/>
    <circle cx="32" cy="54.5" r="3.2"/>
    <circle cx="9.5" cy="32" r="3.2"/>
    <circle cx="54.5" cy="32" r="3.2"/>
  </g>
</svg>
